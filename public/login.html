<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบเจ้าหน้าที่</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="login-logo">🏥</div>
      <h1>ระบบคิวกลาง</h1>
      <p class="hint">${CONFIG.hospitalName}</p>
      <div class="form-field">
        <label for="lUser">ชื่อผู้ใช้</label>
        <input class="form-input" id="lUser" autocomplete="username" autofocus />
      </div>
      <div class="form-field">
        <label for="lPass">รหัสผ่าน</label>
        <input class="form-input" id="lPass" type="password" autocomplete="current-password" />
        <span class="err">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;">เข้าสู่ระบบ</button>
      <p class="hint" style="margin-top:14px;"><a href="index.html">← กลับหน้าจองคิวผู้ป่วย</a></p>
    </form>
  </div>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    document.title = "เข้าสู่ระบบเจ้าหน้าที่ — " + CONFIG.hospitalName;
    document.querySelector(".hint").textContent = CONFIG.hospitalName;
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const field = document.getElementById("lPass").closest(".form-field");
      field.classList.remove("invalid");
      try {
        await api("/api/login", { method: "POST", body: JSON.stringify({
          username: document.getElementById("lUser").value.trim(),
          password: document.getElementById("lPass").value,
        })});
        location.href = "admin.html";
      } catch (err) {
        field.classList.add("invalid");
      }
    });
  </script>
</body>
</html>
