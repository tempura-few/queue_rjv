services:
  mysql:
    image: mysql:8.4
    container_name: hospital-queue-mysql
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-dev-root-pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hospital_queue}
      - MYSQL_USER=${MYSQL_USER:-queueapp}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-dev-app-pass}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"   # เปิดให้เครื่องโฮสต์ต่อเข้ามาดู/แบ็กอัปได้ (จะขึ้น production ให้เอาบรรทัดนี้ออก)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  queue:
    build: .
    container_name: hospital-queue
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8124:8124"   # เปิดเฉพาะภายในเครื่อง ให้ nginx ของเว็บ proxy เข้ามา (ตาม DEPLOY.md)
    volumes:
      - ./data:/app/data         # โหมด STORAGE=json ใช้โฟลเดอร์นี้ / โหมด mysql ไม่ใช้
    environment:
      - TZ=Asia/Bangkok
      - PORT=8124
      # คีย์เซ็น JWT — PDPA: ห้าม hardcode ค่า fallback ในไฟล์ที่ commit ขึ้น repo
      # ต้องตั้งผ่าน .env ของเครื่องนั้น ๆ เท่านั้น (สร้างค่าสุ่ม: openssl rand -hex 32)
      # ถ้าไม่ตั้ง — docker compose จะไม่ start (ขึ้น error) เพื่อไม่ให้เผลอใช้คีย์ที่หลุดสาธารณะ
      - "AUTH_SECRET=${AUTH_SECRET:?ต้องตั้ง AUTH_SECRET ใน .env ก่อน (สร้างด้วย openssl rand -hex 32)}"
      # - AUTH_TTL_HOURS=12         # อายุ token (ชม.) ค่าเริ่มต้น 12
      # ---- โหมดหลัก: MySQL/MariaDB (ตัว compose นี้รัน MySQL คู่กันใน service "mysql" ด้านบน) ----
      - STORAGE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-queueapp}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-dev-app-pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hospital_queue}
      # คีย์เข้ารหัสข้อมูล at rest (PDPA) — json: ทั้งไฟล์ข้อมูล · mysql: รายฟิลด์ PII ในตาราง · ดู .env.example
      - "DATA_KEY=${DATA_KEY:-}"
      # ถ้าจะใช้ MySQL ที่ติดตั้งบนเครื่องโฮสต์แทน container: ลบ service mysql ออก แล้วเปลี่ยน MYSQL_HOST=host.docker.internal
      # (Linux: ใช้ 172.17.0.1 หรือ --network host)
      # ถ้าอยากใช้โหมดไฟล์แทน: เปลี่ยน STORAGE=json แล้วลบ MYSQL_* ทิ้งได้เลย

volumes:
  mysql-data:
