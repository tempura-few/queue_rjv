# ============================================================
# ระบบจองคิว — คอนฟิก nginx วาง "คู่กับ" เว็บ WordPress เดิม
# หลักการ: nginx แยกเว็บด้วยชื่อโดเมน (server_name)
#   - rajavejchiangmai.com  → เว็บ WordPress เดิม (ไม่แตะ)
#   - queue.rajavejchiangmai.com → ส่งต่อเข้าแอปจองคิว (พอร์ต 8124 ภายใน)
#
# วิธีวาง (Ubuntu/Debian):
#   sudo cp nginx-queue.conf /etc/nginx/sites-available/queue.conf
#   sudo ln -s /etc/nginx/sites-available/queue.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   (เครื่อง AlmaLinux/CentOS: วางที่ /etc/nginx/conf.d/queue.conf แทน ไม่ต้อง symlink)
#
# ⚠️ PDPA: ระบบนี้ส่งข้อมูลส่วนบุคคลผู้ป่วย (ชื่อ/เบอร์โทร) ห้าม expose ผ่าน HTTP เด็ดขาด
#   ติดตั้งครั้งแรก: nginx ฟังพอร์ต 80 ก่อน แล้วรัน certbot "ทันที" ในขั้นตอนติดตั้ง:
#     sudo certbot --nginx -d queue.rajavejchiangmai.com
#   certbot จะออกใบรับรอง + เติมบล็อก listen 443 + ตั้ง redirect 80→443 ให้เองอัตโนมัติ
#   (หรือจะใช้บล็อก HTTPS สำเร็จรูปท้ายไฟล์นี้แทนก็ได้ — อ่านคอมเมนต์ก่อนเปิดใช้)
# ============================================================
server {
    listen 80;
    server_name queue.rajavejchiangmai.com;

    # หลังติดตั้ง certbot แล้ว certbot จะแทรก redirect ไป HTTPS ให้เอง
    # ถ้าตั้งเอง ให้ uncomment บรรทัดนี้ (และเปิดใช้บล็อก 443 ท้ายไฟล์):
    # return 301 https://$host$request_uri;

    # ส่งต่อทุกอย่างเข้าแอปจองคิว
    location / {
        proxy_pass http://127.0.0.1:8124;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # รองรับนำเข้าคิวจากไฟล์ (agency-import ส่ง base64 ของไฟล์ ~3 MB ผ่าน JSON body)
        client_max_body_size 8m;
    }
}

# ============================================================
